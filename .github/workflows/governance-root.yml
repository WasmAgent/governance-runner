name: Governance root authority

on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [governance-sweep]

permissions:
  contents: read

concurrency:
  group: governance-root-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    name: Governance root sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked validator dependency
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements.txt

      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: WasmAgent
          repositories: |
            .github
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read

      - name: Sweep open governance PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GOVERNANCE_APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          TARGET_REPO: WasmAgent/.github
          CHECK_NAME: governance-root-authority
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          RUNNER_REPOSITORY: ${{ github.repository }}
          RUNNER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/sweep.py
