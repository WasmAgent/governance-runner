name: Runner self-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Runner self-test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked dependency
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements.txt

      - name: Compile trusted authority
        run: |
          python -m py_compile \
            scripts/sweep.py \
            scripts/self-test.py \
            validators/validate-public-claims.py \
            validators/validate-external-evidence.py

      - name: Exercise vendored authority on fixtures
        run: python scripts/self-test.py
